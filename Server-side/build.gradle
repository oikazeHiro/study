// 定义项目中使用的插件
plugins {
    // 定义项目为Java项目
    id 'java'
    // 使用Spring Boot插件
    id 'org.springframework.boot' version '3.5.0'
    // 使用Spring依赖管理插件
    id 'io.spring.dependency-management' version '1.1.6'
}

// 设置项目组
group = 'com.oik'
// 设置项目版本
version = '0.0.1-SNAPSHOT'
// 配置IDEA支持并下载JavaDoc和源代码
apply plugin: 'idea'
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}
// 配置Java语言版本为21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
// 配置编译依赖时包含注解处理器
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}
// 定义项目仓库
repositories {
    mavenCentral()
}

// 扩展项目对象，设置Spring Boot版本
ext {
    set('springBootVersion', "3.5.0")
    springBootVersion = "3.5.0"
}

// 应用到所有子项目
allprojects {
    apply plugin: 'java'
    group = 'com.oik'
    version = '0.0.1-SNAPSHOT'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    repositories {
        // 阿里云镜像仓库
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        // 腾讯云镜像仓库（注释掉）
        //maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        // 华为镜像仓库（注释掉）
        //maven { url 'https://developer.huawei.com/repo/' }
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
}

// 应用到所有子项目
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    ext {
        set('springBootVersion', "3.5.0")
        springBootVersion = "3.5.0"
    }
    dependencies {
        // 添加Web启动依赖
        implementation 'org.springframework.boot:spring-boot-starter-web'
        // 安全框架
        implementation 'org.springframework.boot:spring-boot-starter-security'
        // 添加测试启动依赖
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        // redis
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        // 验证
        implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.0'
        // 添加JUnit平台启动器
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // 使用Spring Boot的配置处理器插件，以支持@ConditionalOnProperty等注解的处理
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
        // 在编译阶段添加 Lombok 依赖，以便在编译时能够使用 Lombok 提供的注解增强功能
        compileOnly 'org.projectlombok:lombok'
        // 指定 Lombok 为注解处理器，用于处理 Lombok 注解，自动生成代码，如getter、setter等方法
        annotationProcessor 'org.projectlombok:lombok'
        // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-api
        implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
        // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-impl
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
        // https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-jackson
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
        // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
        // 引入 MyBatis-Plus 的 Spring Boot Starter 包，用于简化 MyBatis 的配置和使用
        implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.12'
        // https://mvnrepository.com/artifact/com.baomidou/mybatis-plus-jsqlparser
        implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.12'
        // 引入 MyBatis-Plus 的 Spring Boot Starter 包，用于简化 MyBatis 的配置和使用
        implementation 'com.github.yulichang:mybatis-plus-join-boot-starter:1.5.3'
        // mysql-connector-j
        implementation 'com.mysql:mysql-connector-j:9.3.0'
        // https://mvnrepository.com/artifact/com.sun.mail/javax.mail
        implementation 'com.sun.mail:javax.mail:1.6.2'

    }
    dependencyManagement {
        // 导入Spring Boot依赖管理
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }
    tasks.bootJar {
        // 启用BootJar任务
        enabled = true
    }

}

// 配置测试任务使用JUnit平台
tasks.named('test') {
    useJUnitPlatform()
}
